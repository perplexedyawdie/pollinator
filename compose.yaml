# Run locally with:  podman compose up --build   (or: docker compose up --build)
# Then open http://localhost:8787
services:
  pollinator:
    build: .
    image: pollinator:local
    ports:
      - "127.0.0.1:8787:8787"
    env_file: .env
    volumes:
      # Keeps the session seal key (and short-lived jobs) across restarts.
      - pollinator-data:/app/.data
    restart: unless-stopped

volumes:
  pollinator-data:
